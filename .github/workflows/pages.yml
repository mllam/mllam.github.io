name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Bump this (in a PR) to update the roadmap page at /roadmap.
  GITHUB_MILESTONE_ROADMAP_VERSION: "0.1.0"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css .nojekyll _site/

      - uses: astral-sh/setup-uv@v6

      - name: Build roadmap
        run: uvx "github-milestone-roadmap==${GITHUB_MILESTONE_ROADMAP_VERSION}" build --config roadmap.toml --output _site/roadmap

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
